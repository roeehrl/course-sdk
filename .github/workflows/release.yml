name: Release verification

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Verification only: this workflow cannot publish to npm or create a release.
permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'roeehrl/course-sdk'
    uses: ./.github/workflows/verify.yml
    with:
      release: true

  # Release-only and separate from the reusable verify.yml, so pull-request CI
  # never requests OIDC. Only this job may mint a token, and only to attest the
  # bytes the verify job already retained; it cannot publish to npm or create
  # a release.
  provenance:
    name: SBOM and build provenance
    needs: verify
    if: github.repository == 'roeehrl/course-sdk' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Download the verified release candidate from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-${{ github.ref_name }}-node24
          path: ${{ runner.temp }}/verified-sdk
          digest-mismatch: error
      - name: Generate the CycloneDX SBOM from the verified tarball and committed lock
        run: |
          mkdir "$RUNNER_TEMP/sdk-sbom"
          node scripts/release-sbom.mjs --directory "$RUNNER_TEMP/verified-sdk" --lock package-lock.json --output "$RUNNER_TEMP/sdk-sbom"
      - name: Attest build provenance for the tarball, its verification record and the SBOM
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/verified-sdk/*.tgz
            ${{ runner.temp }}/verified-sdk/verification.json
            ${{ runner.temp }}/sdk-sbom/*.cdx.json
      - name: Retain the SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sdk-${{ github.ref_name }}-sbom
          path: ${{ runner.temp }}/sdk-sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
      - name: Record the attestation
        env:
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
        run: |
          {
            printf 'Build provenance attestation: %s (tarball, verification.json and CycloneDX SBOM)\n' "$ATTESTATION_ID"
            printf 'Verify with: gh attestation verify <file> --repo roeehrl/course-sdk\n'
            printf 'No npm publication or GitHub release was performed.\n'
          } >> "$GITHUB_STEP_SUMMARY"
